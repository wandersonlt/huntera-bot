<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Huntera Bot - Configuração</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    /* Estilo específico para popup */
    body {
      width: 500px !important;
      max-width: 500px !important;
      min-height: 650px !important;
      overflow-y: auto !important;
      margin: 0 auto !important;
    }
    /* Remove barras de rolagem desnecessárias */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 2px;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <span class="title">🎯 Huntera Bot</span>
    <span class="status">
      <span class="status-dot offline" id="statusDot"></span>
      <span id="statusText">Offline</span>
    </span>
    <button class="btn-close" id="closeBtn">✕</button>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">Status</span>
      <span class="status-value" id="statusValue">🔴 Offline</span>
    </div>
    <div class="status-item">
      <span class="status-label">Modo</span>
      <span class="status-value" id="modeValue">Solo</span>
    </div>
    <div class="status-item">
      <span class="status-label">Hunt</span>
      <span class="status-value" id="huntValue">Nenhuma</span>
    </div>
    <div class="status-item">
      <span class="status-label">Pull</span>
      <span class="status-value" id="pullValue">Cauteloso</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="hunt">🏹 Hunt</button>
    <button class="tab" data-tab="sell">💰 Venda</button>
    <button class="tab" data-tab="party">👥 Party</button>
    <button class="tab" data-tab="items">📦 Itens</button>
  </div>

  <!-- Tab: Hunt -->
  <div class="tab-content active" id="tab-hunt">
    <div class="form-group">
      <label>Caçada</label>
      <select id="huntSelect"></select>
    </div>
    
    <div class="form-group">
      <label>Pull</label>
      <select id="pullSelect">
        <option value="Cauteloso">Cauteloso</option>
        <option value="Ousado">Ousado</option>
        <option value="Agressivo">Agressivo</option>
      </select>
    </div>

    <div class="form-group">
      <label>Modo Party</label>
      <select id="partyModeSelect">
        <option value="solo">Solo</option>
        <option value="leader">Líder</option>
        <option value="member">Membro</option>
      </select>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="autoStart" checked>
      <label for="autoStart">Auto Start</label>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="retryOnFail" checked>
      <label for="retryOnFail">Retry on Fail</label>
    </div>
    
    <div class="flex gap-4">
      <button class="btn btn-primary flex-1" id="startHuntBtn">▶️ Iniciar Caçada</button>
      <button class="btn" id="toggleHuntBtn">🟢 Ativo</button>
    </div>
  </div>

  <!-- Tab: Sell -->
  <div class="tab-content" id="tab-sell">
    <div class="checkbox-group">
      <input type="checkbox" id="ignoreEquipped" checked>
      <label for="ignoreEquipped">Ignorar equipados</label>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="autoSell" checked>
      <label for="autoSell">Vender na cidade</label>
    </div>
    
    <div class="form-group">
      <label>Cooldown</label>
      <select id="cooldownSelect">
        <option value="5000">5 segundos</option>
        <option value="10000" selected>10 segundos</option>
        <option value="15000">15 segundos</option>
        <option value="30000">30 segundos</option>
      </select>
    </div>
    
    <div class="flex gap-4">
      <button class="btn btn-primary flex-1" id="forceSellBtn">💰 Forçar Venda</button>
      <button class="btn" id="toggleSellBtn">🟢 Ativo</button>
    </div>
  </div>

  <!-- Tab: Party -->
  <div class="tab-content" id="tab-party">
    <div class="checkbox-group">
      <input type="checkbox" id="acceptInvite" checked>
      <label for="acceptInvite">Aceitar convite de party</label>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="acceptHunt" checked>
      <label for="acceptHunt">Aceitar convite de caçada</label>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="acceptCostShare" checked>
      <label for="acceptCostShare">Aceitar rateio</label>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="followLeader" checked>
      <label for="followLeader">Seguir líder</label>
    </div>
    
    <div class="flex gap-4">
      <button class="btn flex-1" id="togglePartyBtn">🟢 Ativo</button>
    </div>
  </div>

  <!-- Tab: Items -->
  <div class="tab-content" id="tab-items">
    <div class="form-group">
      <label>Buscar Item</label>
      <div class="flex gap-4">
        <input type="text" id="itemSearch" placeholder="Digite o nome do item..." class="flex-1">
        <button class="btn" id="addItemBtn">➕</button>
      </div>
    </div>
    
    <div class="form-group">
      <label>Categoria</label>
      <select id="categoryFilter">
        <option value="">Todas</option>
      </select>
    </div>
    
    <div class="items-list" id="blockedItemsList"></div>
    
    <div class="flex gap-4 mt-8">
      <button class="btn" id="clearItemsBtn">🗑️ Limpar</button>
      <button class="btn" id="exportItemsBtn">📤 Exportar</button>
      <button class="btn" id="importItemsBtn">📥 Importar</button>
    </div>
    
    <div class="mt-8" id="itemCount">Total: 0 itens bloqueados</div>
    <div class="mt-4" id="itemSearchResults"></div>
  </div>

  <!-- Log -->
  <div class="log" id="logContainer">
    <div class="info">🟢 Bot inicializado</div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
